kind = "web"
previewPath = "/"
title = "Reflow Training Coach"
description = "A live AI chat for adult amateur athletes balancing endurance, recreational sport, and strength. Athletes discuss changes across a fictional sample week, receive conversational impact guidance, and review optional plan edits before applying them."
version = "1.0.0"
id = "artifacts/reflow-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20368

[services.development]
run = "pnpm --filter @workspace/reflow-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reflow-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/reflow-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20368"
BASE_PATH = "/"
